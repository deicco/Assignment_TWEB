<!DOCTYPE html>
<html lang="it" data-bs-theme="dark"> <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IUM-TWEB | Archivio Film</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style_index.css">
</head>
<body>

<header class="main-header py-4 mb-4 text-center">
    <div class="container">
        <h1 class="display-5 fw-bold text-orange">🎬 Archivio Completo Film</h1>
        <p class="text-muted">Gateway: Porta 3000</p>
    </div>
</header>

<main class="container">
    <section id="search-section" class="mb-5 p-4 rounded-4 bg-dark-card shadow">
        <h2 class="text-orange mb-3">Ricerca Film</h2>
        <div class="input-group input-group-lg">
            <input type="text" id="searchInput" class="form-control border-orange" placeholder="Nome del film o keyword...">
            <button class="btn btn-orange px-4 fw-bold" type="button" onclick="handleSearch()">Cerca</button>
        </div>
    </section>

    <section id="movies-list-container">
        <h2 class="text-orange border-bottom border-orange pb-2 mb-4">Elenco Film</h2>

        <div id="movies-list" class="row row-cols-1 row-cols-md-2 g-4">
            <div class="col-12 text-center text-muted py-5">Caricamento in corso...</div>
        </div>

        <nav aria-label="Page navigation" class="mt-5">
            <ul id="pagination-controls" class="pagination justify-content-center pagination-lg">
                <li class="page-item">
                    <button class="page-link" onclick="changePage(-1)" id="prevPage">Precedente</button>
                </li>
                <li class="page-item disabled">
                     <span class="page-link bg-dark border-0 text-orange">
                         Pagina <span id="currentPage" class="fw-bold">1</span> di <span id="totalPages">?</span>
                     </span>
                </li>
                <li class="page-item">
                    <button class="page-link" onclick="changePage(1)" id="nextPage">Successiva</button>
                </li>
            </ul>
        </nav>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/handlebars@4.7.7/dist/handlebars.min.js"></script>
<script src="client.js"></script>

<script id="movies-template" type="text/x-handlebars-template">
    {{#each content}}
        <div class="col">
            <div class="card h-100 movie-card-custom shadow-sm">
                <div class="row g-0 h-100">
                    <div class="col-4 movie-poster-col">
                        <img src="{{posterLink}}" class="img-fluid rounded-start h-100 object-fit-cover" alt="Poster di {{movie.name}}"
                             onerror="this.src='https://via.placeholder.com/150x225?text=No+Poster';">
                    </div>
                    <div class="col-8">
                        <div class="card-body d-flex flex-column h-100">
                            <h5 class="card-title text-orange fw-bold">{{movie.name}}</h5>
                            <p class="card-text text-muted mb-1">
                                <small>Anno: {{getYear movie.date}}</small>
                            </p>
                            <p class="card-text">
                                <span class="badge bg-orange text-dark">Rating: {{formatRating movie.rating}} / 5</span>
                            </p>
                            <div class="mt-auto text-end">
                                <a href="movie_detail.html?id={{movie.id}}" class="btn btn-outline-orange btn-sm stretched-link">Vedi Dettagli →</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    {{/each}}
</script>

<script>
    // --- Helper Handlebars ---
    Handlebars.registerHelper('getYear', function(yearNumber) {
        if (!yearNumber || yearNumber === 0 || yearNumber < 1850) return 'N.A.';
        return yearNumber;
    });

    Handlebars.registerHelper('formatRating', function(rating) {
        if (rating === null || rating === undefined || rating === 0) return 'N.A.';
        return rating;
    });

    // --- Logica Frontend ---
    let currentPage = 0;
    const pageSize = 10; // Ridotto a 10 per visualizzare meglio le card grandi
    const template = Handlebars.compile(document.getElementById('movies-template').innerHTML);

    async function loadMovies() {
        // Mostra loader
        document.getElementById('movies-list').innerHTML = '<div class="col-12 text-center py-5"><div class="spinner-border text-orange" role="status"></div></div>';

        const data = await getMoviesList(currentPage, pageSize, {
            name: document.getElementById('searchInput').value
        });

        document.getElementById('movies-list').innerHTML = template(data);

        // Aggiorna controlli paginazione con classi Bootstrap
        document.getElementById('currentPage').textContent = currentPage + 1;
        document.getElementById('totalPages').textContent = data.totalPages;

        const prevBtn = document.getElementById('prevPage').parentElement;
        const nextBtn = document.getElementById('nextPage').parentElement;

        currentPage === 0 ? prevBtn.classList.add('disabled') : prevBtn.classList.remove('disabled');
        currentPage === data.totalPages - 1 ? nextBtn.classList.add('disabled') : nextBtn.classList.remove('disabled');
    }

    function changePage(delta) {
        currentPage += delta;
        loadMovies();
    }

    function handleSearch() {
        const searchValue = document.getElementById('searchInput').value;
        console.log("Ricerca:", searchValue);
        currentPage = 0;
        loadMovies();
    }

    // Enter key per ricerca
    document.getElementById('searchInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') handleSearch();
    });

    // Avvio iniziale
    loadMovies();
</script>
</body>
</html>
